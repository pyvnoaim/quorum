<!-- square canvas so macOS Quick Look renders it 1:1; the banner is the centre
     480px band, cropped out with `sips -c 480 1360`. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1360" viewBox="0 0 1360 1360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c20"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="1360" height="1360" fill="#0a0a0a"/>

  <g transform="translate(0 440)">
    <rect width="1360" height="480" fill="url(#bg)"/>

    <!-- lockup centred on the card: the avatar sits bottom-left over the
         banner, so nothing of ours goes there. -->
    <g fill="#ededed" transform="translate(478 166) scale(0.889) translate(-12 -12)">
      <path d="M56 56 L100 56 A44 44 0 1 0 56 100 Z"/>
      <rect x="68" y="68" width="34" height="34"/>
    </g>

    <text x="736" y="234" fill="#ededed" text-anchor="middle"
          font-family="SF Pro Display, -apple-system, Helvetica Neue, Helvetica"
          font-size="84" font-weight="600" letter-spacing="-2.6">Quorum</text>
    <text x="680" y="306" fill="#8a8a8a" text-anchor="middle"
          font-family="SF Pro Text, -apple-system, Helvetica Neue, Helvetica"
          font-size="32" font-weight="400" letter-spacing="0.4">Scrims for KovaaK's</text>
  </g>
</svg>
